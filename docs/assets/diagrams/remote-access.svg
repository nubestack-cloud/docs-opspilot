<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" role="img" aria-labelledby="remote-access-title remote-access-desc">
  <title id="remote-access-title">Remote triage through the workstation's tunnel</title>
  <desc id="remote-access-desc">The ChatGPT mobile or web app exchanges tool calls and redacted results with OpsPilot through an OpenAI tunnel. The tunnel client on the workstation connects outbound and forwards only to OpsPilot's token-protected MCP connector on 127.0.0.1; no public listener is opened. Command Safety and approval remain on the workstation, which reaches the target hosts using its existing VPN connection. Auto-run starts off; High risk commands always need a click at the workstation and a typed reason if the profile requires it.</desc>
  <defs>
    <marker id="remote-access-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-arrow--accent" d="M0 0 8 4 0 8Z"/></marker>
  </defs>
  <text class="d-label" x="24" y="30">REMOTE TRIAGE · APPROVAL STAYS AT THE WORKSTATION</text>
  <rect class="d-zone" x="536" y="56" width="400" height="430" rx="14"/>
  <text class="d-label" x="556" y="86">WORKSTATION ON YOUR VPN</text>
  <rect class="d-zone" x="24" y="330" width="456" height="156" rx="14"/>
  <text class="d-label" x="44" y="360">DISCONNECTED SERVERS AND DEVICES</text>

  <path class="d-flow" d="M230 156H274" marker-start="url(#remote-access-arrow)" marker-end="url(#remote-access-arrow)"/>
  <path class="d-flow" d="M486 156H554" marker-start="url(#remote-access-arrow)" marker-end="url(#remote-access-arrow)"/>
  <text class="d-muted d-centred" x="252" y="264">Tool calls in · redacted results back</text>

  <rect class="d-card" x="24" y="90" width="200" height="132" rx="12"/>
  <svg class="d-icon" x="44" y="112" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 5H15M11 19H13"/></svg>
  <text class="d-title" x="86" y="136">ChatGPT</text>
  <text class="d-muted" x="44" y="180">Mobile or web app</text>

  <rect class="d-card" x="280" y="90" width="200" height="132" rx="12"/>
  <svg class="d-icon" x="300" y="112" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18H5A4 4 0 0 1 5 10 7 7 0 0 1 19 9 4.5 4.5 0 0 1 19 18H17M12 12V22M9 19 12 22 15 19"/></svg>
  <text class="d-title" x="342" y="136">OpenAI tunnel</text>
  <text class="d-muted" x="300" y="180">Secure forwarding</text>

  <rect class="d-card" x="560" y="110" width="352" height="120" rx="12"/>
  <svg class="d-icon" x="580" y="132" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21H16M12 16V21M7 8 10 11 7 14M13 13H17"/></svg>
  <text class="d-title" x="624" y="154">OpsPilot MCP</text>
  <text class="d-muted" x="580" y="186">127.0.0.1 only · token required</text>
  <text class="d-muted" x="580" y="209">The tunnel client connects outbound</text>
  <path class="d-flow" d="M736 230V272" marker-end="url(#remote-access-arrow)"/>

  <rect class="d-card--accent" x="560" y="272" width="352" height="180" rx="12"/>
  <text class="d-title" x="580" y="310">Approval and Command Safety</text>
  <text class="d-muted" x="580" y="342">Rules apply on this workstation.</text>
  <text class="d-muted" x="580" y="366">High risk always needs a local click.</text>
  <text class="d-muted" x="580" y="390">Typed reason if the profile asks.</text>
  <text class="d-muted" x="580" y="426">Auto-run is off by default.</text>

  <path class="d-flow" d="M560 402H480" marker-end="url(#remote-access-arrow)"/>
  <text class="d-muted d-centred" x="520" y="386">VPN</text>
  <rect class="d-card" x="44" y="382" width="192" height="80" rx="10"/>
  <svg class="d-icon" x="60" y="402" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5H7.1M7 17.5H7.1M11 6.5H17M11 17.5H17"/></svg>
  <text class="d-title" x="100" y="418">Servers</text>
  <text class="d-muted" x="100" y="441">Existing sessions</text>
  <rect class="d-card" x="260" y="382" width="200" height="80" rx="10"/>
  <svg class="d-icon" x="276" y="402" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11H6.1M10 11H10.1M14 11H14.1M18 11H18.1M6 14H18M7 4 4 7M17 4 20 7"/></svg>
  <text class="d-title d-title--small" x="314" y="418">Network devices</text>
  <text class="d-muted" x="314" y="441">Existing sessions</text>

  <text class="d-muted d-centred" x="480" y="526">Read-only checks can run remotely when the connection's Command Safety profile permits them.</text>
</svg>
